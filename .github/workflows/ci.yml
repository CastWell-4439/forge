name: CI

on:
  push:
    branches: [main, master, develop, "feature/**"]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

# api/proto/gen/ is gitignored (.gitignore:94) but imported by every layer
# (cmd/*, internal/coordinator, internal/worker, internal/agent/session, test/*).
# Nothing checked it in, so a fresh checkout could not compile. Every job below
# therefore installs buf and generates the code first. buf is pinned so CI does
# not silently pick up a new generator version.
jobs:
  # These are the "hard acceptance" gates the design docs promised but never
  # wired up. They are deliberately separate from lint/test so a style or
  # encoding regression reports itself instead of hiding inside a test failure.
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.73.0"
      - name: Generate protobuf code
        run: buf generate
      - name: gofmt must be clean
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "ERROR: not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt: clean"
      - name: No whitespace errors in the pushed range
        run: |
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            git diff --check HEAD~1 HEAD
            echo "git diff --check: clean"
          else
            echo "single-commit history; skipping range check"
          fi
      - name: No merge conflict markers
        run: |
          if grep -rnE '^(<<<<<<<|>>>>>>>|=======)$' \
               --include='*.go' --include='*.yaml' --include='*.yml' \
               --include='*.proto' --include='*.md' \
               internal cmd api workflows test 2>/dev/null; then
            echo "ERROR: merge conflict markers found"
            exit 1
          fi
          echo "conflict markers: none"
      - name: No BOM or U+FFFD replacement characters
        run: |
          # A recurring accident class in this repo: editors and PowerShell
          # Set-Content introduced UTF-8 BOMs and U+FFFD into Go sources, which
          # once shipped a SyntaxError to production. Gate it instead of
          # relying on remembering.
          fail=0
          if grep -rlP '^\xEF\xBB\xBF' --include='*.go' --include='*.yaml' \
               --include='*.yml' --include='*.proto' internal cmd api workflows test; then
            echo "ERROR: UTF-8 BOM found in the files above"; fail=1
          fi
          if grep -rlP '\xEF\xBF\xBD' --include='*.go' --include='*.yaml' \
               --include='*.yml' --include='*.proto' internal cmd api workflows test; then
            echo "ERROR: U+FFFD replacement character found in the files above"; fail=1
          fi
          [ "$fail" -eq 0 ] && echo "encoding: clean"
          exit $fail
      - name: ForgeX core must stay de-domainised
        run: |
          # The control plane is domain-agnostic by design: domain terms belong in
          # adapters and workers, never in ForgeX core or its CLI. This is the
          # author's own acceptance rule, now enforced.
          if grep -rniE 'video|ffmpeg|face_swap|faceswap|lipsync|subtitle|bgm|tts|avatar' \
               --include='*.go' internal/forgex cmd/forgex; then
            echo "ERROR: business-domain vocabulary leaked into ForgeX core"
            exit 1
          fi
          echo "forgex core: de-domainised"
      - name: Build and smoke-test the forgex CLI
        run: |
          go build -o bin/forgex ./cmd/forgex
          ./bin/forgex version
          ./bin/forgex help
          echo "forgex smoke: ok"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.73.0"
      - name: Generate protobuf code
        run: buf generate
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, and pinned to a version that supports the Go release this
          # module targets: a v1-line linter rejects a Go 1.26 module outright.
          version: v2.14.0
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    # The failure path pushes test-output.log to the ci-test-logs branch so the
    # raw output is readable without repository access. Job-level permissions
    # override the workflow-wide read-only default for this job alone.
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.73.0"
      - name: Generate protobuf code
        run: buf generate
      - name: Run tests
        env:
          FORGE_PG_DSN: "postgres://forge:forge@localhost:5432/forge_test?sslmode=disable"
          FORGE_REDIS_ADDR: "localhost:6379"
        run: |
          # The runner starts bash with -e, so the failing `go test | tee`
          # pipeline would kill this script before any failure handling ran -
          # which is why previous rounds reported only an exit code. Take
          # errexit back so the script controls its own exit status.
          set +e
          # pipefail so tee cannot swallow the test exit status. On failure the
          # output is annotated with a file location, pushed verbatim to the
          # ci-test-logs branch (readable without repository access), and
          # summarised on the run page.
          set -o pipefail
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./... 2>&1 | tee test-output.log
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            grep -E -- '--- FAIL|^FAIL[[:space:]]' test-output.log | head -n 15 | while IFS= read -r line; do
              echo "::error file=.github/workflows/ci.yml,line=163,title=go test::${line}"
            done
            if grep -q 'DATA RACE' test-output.log; then
              grep -m 3 -B 2 -A 12 'DATA RACE' test-output.log | head -n 60 | while IFS= read -r line; do
                echo "::error file=.github/workflows/ci.yml,line=163,title=Data Race::${line}"
              done
            fi
            {
              echo "## Test failures"
              echo '```'
              grep -E -A 20 -- '--- FAIL|DATA RACE|^FAIL[[:space:]]' test-output.log | tail -n 500
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            {
              git config user.name "ci-log"
              git config user.email "ci-log@localhost"
              git add -f test-output.log
              git commit -m "test output for run ${GITHUB_RUN_ID}" -q
              git push --force origin HEAD:ci-test-logs -q
            } || echo "::warning file=.github/workflows/ci.yml,line=163,title=Log export::could not push the test log"
          fi
          exit "$STATUS"
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.73.0"
      - name: Generate protobuf code
        run: buf generate
      - name: Build binaries
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/coordinator ./cmd/coordinator
          CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/worker ./cmd/worker
      - name: Verify binary size
        run: |
          ls -lh bin/
          # Coordinator should be < 30MB
          size=$(stat --format=%s bin/coordinator)
          if [ "$size" -gt 31457280 ]; then
            echo "ERROR: coordinator binary too large: $size bytes"
            exit 1
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/
          retention-days: 7
