version: "2"

# The gate this repository actually holds itself to.
#
# Nothing here has ever been enforced: the workflow existed but CI never ran
# until it was first pushed. Under golangci-lint v2 the same settings report ~270
# findings in pre-existing code, almost all of them in three categories that this
# config therefore does not gate on. The reason for each is recorded so the gap is
# visible rather than hidden.
#
#   errcheck  ~60  unchecked Close/Write/Encode on cleanup paths. Idiomatic in
#                  this codebase and spread across packages unrelated to any
#                  current work; gating on it would mean a repo-wide change.
#   govet     ~50  the `shadow` check, which only runs under enable-all.
#   staticcheck QF style suggestions (fmt.Fprintf instead of WriteString(Sprintf),
#                  De Morgan's law). v2 enables these by default; they are
#                  suggestions, not defects.
#
# What is enforced: govet (default checks), staticcheck (non-style), unused,
# ineffassign, misspell, and the gofmt/goimports formatters.

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
  settings:
    govet:
      disable:
        - fieldalignment
        - inline
    # misspell's locale option is deliberately not set to US: this codebase mixes
    # British spellings ("cancelled", "behaviour") throughout, and forcing one
    # locale reports those as errors while catching nothing real.
    staticcheck:
      checks:
        - all
        - -QF1001 # De Morgan's law: a style preference, not a defect
        - -QF1012 # fmt.Fprintf instead of WriteString(fmt.Sprintf(...)): style
        - -ST1000 # package comment: not every package here carries one
  exclusions:
    # Generated protobuf code is not ours to lint.
    paths:
      - api/proto/gen

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/castwell/forge

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
